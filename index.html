<!DOCTYPE html>
<html lang="en"> 
<head> 
<meta charset="UTF-8"> 

<style>
  .project-title {
    background: #172554;
    color: white;
    text-align: center;
    padding: 16px 20px;
    font-family: Arial, sans-serif;
    border-radius: 8px;
  }
   
</style>
</head>

<body>

<style>
    body {
        font-family: Arial, sans-serif;
        text-align: center;
        background-color: #EAF0F8;
        margin: 30px;
    }


    textarea {
        width: 600px;
        height: 100px;
        font-family:  Arial, sans-serif;
        font-size: 14px;
        padding: 10px;
    }

    button {
        margin-top: 10px;
        padding: 10px 20px;
        font-size: 14px;
        cursor: pointer;
    }

    #errorMessage {
        color:#FF0000;
        margin: 15px;
        font-weight: bold;
    }

    #goodMessage {
        color: #008000;
        margin: 15px;
        font-weight: bold;
    }

    #createGrid {
        display: grid;
        grid-template-columns: repeat(50, 10px);
        grid-template-rows: repeat(50, 10px);
        width: 500px;
        height: 500px;
        margin: 20px auto;
        border: 2px solid black;
        background-color: white;
    }

    .cell {
        width: 10px;
        height: 10px;
        box-sizing: border-box;
        border: 1px solid #ddd;
    }

    .pixel {
        background-color: black;
    }
</style>

</head>

<body>

<div class="project-title">
  <p>Team: Glendia Fowler-Cartwright * Sean Peterson</p>
  <h1>CSC 521 Project 1</h1>
  
</div

<p> </p>
<p> </p>


  Enter a set of coordinates using this format: <strong>{(5,5),(6,5),(7,5),(5,6),(6,6),(7,6)}</strong>
  <br>
  (The values in the text box are placeholders. Enter your own sets of tuples to generate an image.)
</p>

<form id="coordinateForm">
    <textarea
        id="coordinates"
        placeholder="{(5,5),(6,5),(7,5),(5,6),(6,6),(7,6)}"
    ></textarea>
    <br>
    <button type="submit">Create Shape</button>
</form>

<div id="errorMessage"></div>
<div id="goodMessage"></div>

<div id="createGrid"></div>

<!-- Used Chat.deepseek to help with creating and debugging the 50 x 50 Grid, along with cell data set xy. -->

<script>
    const form = document.getElementById("coordinateForm");
    const input = document.getElementById("coordinates");
    const grid = document.getElementById("createGrid");
    const errorMessage = document.getElementById("errorMessage");
    const goodMessage = document.getElementById("goodMessage");

    // Grid
    function createGrid() {
        grid.innerHTML = "";

        for (let y = 49; y >= 0; y--) {
            for (let x = 0; x < 50; x++) {
                const cell = document.createElement("div");

                cell.classList.add("cell");
                cell.dataset.x = x;
                cell.dataset.y = y;

                grid.appendChild(cell);
            }
        }
    }

    // Used Chat.deepseek to help debug parsing the input . -->
    function parseImage(input) {
        const pixels = new Set();

        // This removes the whitespace
        const cleanedInput = input.replace(/\s/g, "");
      
        if (!cleanedInput.startsWith("{") ||
            !cleanedInput.endsWith("}")) {
            throw new Error(
                "Invalid format. Your input must start with '{' and end with '}'."
            );
        }

        const contents = cleanedInput.slice(1, -1);

        if (contents === "") {
            throw new Error("Enter at least one coordinate.");
        }

       
        const matches = cleanedInput.match(/\(\d+,\d+\)/g) || [];

        if (matches.length === 0) {
            throw new Error(
                "No valid coordinates were found. Example: {(5,5),(6,5)}"
            );
        }

    // Used Chat.deepseek to help with this section. -->    
        // Valid coordinates
        const reconstructed = "{" + matches.join(",") + "}";

        if (reconstructed !== cleanedInput) {
            throw new Error(
                "Invalid coordinate format. Use {(x,y),(x,y),...}"
            );
        }

        for (const match of matches) {
            const [x, y] = match
                .slice(1, -1)
                .split(",")
                .map(Number);

            // Check  for coordinates on the grid
            if (x < 0 || x > 49 || y < 0 || y > 49) {
                throw new Error(
                    `Coordinate (${x},${y}) is outside the grid. ` +
                    "Both x and y must be between 0 and 49."
                );
            }

            // Remove duplicate pixels
            pixels.add(`${x},${y}`);
        }

        return pixels;
    }

    // Create the shape
    function drawShape(pixels) {
        // Clear previous shape
        document.querySelectorAll(".pixel").forEach(cell => {
            cell.classList.remove("pixel");
        });

        for (const coordinate of pixels) {
            const [x, y] = coordinate.split(",").map(Number);

            const cell = document.querySelector(
                `.cell[data-x="${x}"][data-y="${y}"]`
            );

            if (cell) {
                cell.classList.add("pixel");
            }
        }
    }

    // Handle form submission
    form.addEventListener("submit", function(event) {
        event.preventDefault();

        errorMessage.textContent = "";
        goodMessage.textContent = "";

        try {
            const pixels = parseImage(input.value);

            drawShape(pixels);

            goodMessage.textContent =
                `Well done! `;

        } catch (error) {
            errorMessage.textContent = error.message;

            // If there is an error, clear the grid
            document.querySelectorAll(".pixel").forEach(cell => {
                cell.classList.remove("pixel");
            });
        }
    });

    // Page loads, create the grid 
    createGrid();
</script>

</body> </html>
