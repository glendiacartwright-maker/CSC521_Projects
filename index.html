<!DOCTYPE html>
<html>
<head>
    <title>My JavaScript Program</title>
</head>
<body>

    <h1>My JavaScript Program</h1>

    <button onclick="sayHello()">Click Me</button>

    <p id="output"></p>

    <script>
        function sayHello() {
            document.getElementById("output").textContent = "Hello from JavaScript!";
        }
    </script>

</body>
</html>
