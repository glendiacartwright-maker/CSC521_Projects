<!DOCTYPE html>
<html lang="en"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
<title>CSC 521: Project 1: Glendia Fowler-Cartwright; Sean Peterson</title>

<style>
    body {
        font-family: Arial, sans-serif;
        text-align: center;
        background-color: #f4f4f4;
        margin: 30px;
    }

    textarea {
        width: 500px;
        height: 100px;
        font-family: monospace;
        font-size: 16px;
        padding: 10px;
    }

    button {
        margin-top: 10px;
        padding: 10px 20px;
        font-size: 16px;
        cursor: pointer;
    }

    #error {
        color: #c62828;
        margin: 15px;
        font-weight: bold;
    }

    #success {
        color: #2e7d32;
        margin: 15px;
        font-weight: bold;
    }

    #grid {
        display: grid;
        grid-template-columns: repeat(50, 10px);
        grid-template-rows: repeat(50, 10px);
        width: 500px;
        height: 500px;
        margin: 20px auto;
        border: 2px solid black;
        background-color: white;
    }

    .cell {
        width: 10px;
        height: 10px;
        box-sizing: border-box;
        border: 1px solid #ddd;
    }

    .pixel {
        background-color: black;
    }
</style>

</head>

<body>

<h1>CSC521 Project 1</h1>
<br
<h3> Team:  Glendia Fowler-Cartwright and Sean Peterson </h3>
<br
<br
<br
<p>
    Enter a set of coordinates using this format: (The values in the text box are placeholders. Enter your own sets of tuples to generate a shape.)
    <br
    <strong>{(5,5),(6,5),(7,5),(5,6),(6,6),(7,6)}</strong>
</p>

<form id="coordinateForm">
    <textarea
        id="coordinates"
        placeholder="{(5,5),(6,5),(7,5),(5,6),(6,6),(7,6)}"
    ></textarea>
    <br>
    <button type="submit">Create Shape</button>
</form>

<div id="error"></div>
<div id="success"></div>

<div id="grid"></div>

<script>
    const form = document.getElementById("coordinateForm");
    const input = document.getElementById("coordinates");
    const grid = document.getElementById("grid");
    const errorMessage = document.getElementById("error");
    const successMessage = document.getElementById("success");

    // Create the 50 x 50 grid
    function createGrid() {
        grid.innerHTML = "";

        for (let y = 49; y >= 0; y--) {
            for (let x = 0; x < 50; x++) {
                const cell = document.createElement("div");

                cell.classList.add("cell");
                cell.dataset.x = x;
                cell.dataset.y = y;

                grid.appendChild(cell);
            }
        }
    }

    
    function parseImage(input) {
        const pixels = new Set();

        // Remove whitespace
        const cleanedInput = input.replace(/\s/g, "");

        // Check basic format
        if (!cleanedInput.startsWith("{") ||
            !cleanedInput.endsWith("}")) {
            throw new Error(
                "Invalid format. Your input must start with '{' and end with '}'."
            );
        }

        // Extract the contents between { and }
        const contents = cleanedInput.slice(1, -1);

        if (contents === "") {
            throw new Error("Please enter at least one coordinate.");
        }

        // Split into coordinate pairs
        const pairs = contents.split(",");

        // There should be coordinate pairs, not individual numbers
        const matches = cleanedInput.match(/\(\d+,\d+\)/g) || [];

        if (matches.length === 0) {
            throw new Error(
                "No valid coordinates were found. Example: {(5,5),(6,5)}"
            );
        }

        // Make sure the entire contents consists of valid coordinates
        const reconstructed = "{" + matches.join(",") + "}";

        if (reconstructed !== cleanedInput) {
            throw new Error(
                "Invalid coordinate format. Use {(x,y),(x,y),...}"
            );
        }

        for (const match of matches) {
            const [x, y] = match
                .slice(1, -1)
                .split(",")
                .map(Number);

            // Check that coordinates are on the 50 x 50 grid
            if (x < 0 || x > 49 || y < 0 || y > 49) {
                throw new Error(
                    `Coordinate (${x},${y}) is outside the grid. ` +
                    "Both x and y must be between 0 and 49."
                );
            }

            // A Set automatically removes duplicate pixels
            pixels.add(`${x},${y}`);
        }

        return pixels;
    }

    // Draw the pixels
    function drawShape(pixels) {
        // Clear previous shape
        document.querySelectorAll(".pixel").forEach(cell => {
            cell.classList.remove("pixel");
        });

        for (const coordinate of pixels) {
            const [x, y] = coordinate.split(",").map(Number);

            const cell = document.querySelector(
                `.cell[data-x="${x}"][data-y="${y}"]`
            );

            if (cell) {
                cell.classList.add("pixel");
            }
        }
    }

    // Handle form submission
    form.addEventListener("submit", function(event) {
        event.preventDefault();

        errorMessage.textContent = "";
        successMessage.textContent = "";

        try {
            const pixels = parseImage(input.value);

            drawShape(pixels);

            successMessage.textContent =
                `Shape drawn successfully! ${pixels.size} unique pixel(s).`;

        } catch (error) {
            errorMessage.textContent = error.message;

            // Clear the grid if there is an error
            document.querySelectorAll(".pixel").forEach(cell => {
                cell.classList.remove("pixel");
            });
        }
    });

  
</script>
</body></html>
